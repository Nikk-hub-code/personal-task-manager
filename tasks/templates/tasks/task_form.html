<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create Task</title>
</head>
<body>

    <h1>Create a Task</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Create Task
        </button>

    </form>

    <br>

    <a href="{% url 'task_list' %}">
        Back to Tasks
    </a>

</body>
</html>
