<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit {{ task.title }}</title>
</head>
<body>

    <h1>Edit Task</h1>

    <form method="POST">

        {% csrf_token %}

        <label for="title">Task:</label>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ task.title }}"
            required
        >

        <br><br>

        <label for="description">Description:</label>
        <textarea
            id="description"
            name="description"
        >{{ task.description }}</textarea>

        <br><br>

        <label for="priority">Priority:</label>

        <select id="priority" name="priority">

            <option value="low"
                {% if task.priority == "low" %}selected{% endif %}>
                Low
            </option>

            <option value="medium"
                {% if task.priority == "medium" %}selected{% endif %}>
                Medium
            </option>

            <option value="high"
                {% if task.priority == "high" %}selected{% endif %}>
                High
            </option>

        </select>

        <br><br>

        <label>
            <input
                type="checkbox"
                name="completed"
                {% if task.completed %}checked{% endif %}
            >
            Completed
        </label>

        <br><br>

        <button type="submit">Save Changes</button>

    </form>

    <br>

    <a href="{% url 'task_detail' task.id %}">
        Cancel
    </a>

</body>
</html>
