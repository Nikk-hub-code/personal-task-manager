<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit {{ task.title }}</title>
</head>
<body>

    <h1>Edit Task</h1>

    <form method="POST">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Save Changes
        </button>

    </form>

    <br>

    <a href="{% url 'task_detail' task.id %}">
        Cancel
    </a>

</body>
</html>
