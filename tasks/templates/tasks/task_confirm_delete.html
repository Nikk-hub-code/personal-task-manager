<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Delete {{ task.title }}</title>
</head>
<body>

    <h1>Delete Task</h1>

    <p>
        Are you sure you want to delete:
    </p>

    <h2>{{ task.title }}</h2>

    <p>
        This action cannot be undone.
    </p>

    <form method="POST">

        {% csrf_token %}

        <button type="submit">
            Yes, Delete Task
        </button>

    </form>

    <br>

    <a href="{% url 'task_detail' task.id %}">
        Cancel
    </a>

</body>
</html>
