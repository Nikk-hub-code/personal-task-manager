<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Personal Task Manager</title>
</head>
<body>

    <h1>Hello, {{ name }}!</h1>

    <h2>Your Tasks</h2>

    {% if tasks %}

        <ul>
            {% for task in tasks %}
                <li>{{ task.title }}</li>
            {% endfor %}
        </ul>

    {% else %}

        <p>You have no tasks.</p>

    {% endif %}

</body>
</html>
