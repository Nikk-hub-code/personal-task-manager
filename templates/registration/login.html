{% extends "tasks/base.html" %}

{% block title %}Login{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h2>Welcome Back</h2>

        <p class="auth-subtitle">
            Login to manage your tasks.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <input
                type="hidden"
                name="next"
                value="{{ next }}"
            >

            <button type="submit" class="button primary-button auth-button">
                Login
            </button>

        </form>

        <p class="auth-footer">
            Don't have an account?
            <a href="{% url 'signup' %}">Sign Up</a>
        </p>

    </div>

</div>

{% endblock %}
